site_name: zarr-sqlite
site_url: https://auxym.github.io/zarr-sqlite
repo_url: https://github.com/auxym/zarr-sqlite
edit_uri: edit/main/docs/

theme:
  name: mkdocs

docs_dir: docs

nav:
  - Home: index.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            show_source: false
            show_root_heading: true
            show_if_no_docstring: true
