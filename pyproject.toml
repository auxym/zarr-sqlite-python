[project]
name = "zarr-sqlite"
version = "1.0.1"
description = "Single-file Zarr v3 dataset store using SQLite"
readme = "README.md"
authors = [
    { name = "Francis Thérien", email = "frtherien@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE.txt",]
requires-python = ">=3.12"
dependencies = [
    "zarr>=3.2.1",
]

[project.optional-dependencies]
test = [
    "mypy>=1.17.0",
    "pytest>=8.4.1",
]

[project.urls]
Documentation = "https://auxym.github.io/zarr-sqlite-python/zarr_sqlite.html"
Source = "https://github.com/auxym/zarr-sqlite-python"
"Format specification" = "https://github.com/auxym/zarr-sqlite-python/blob/main/SPEC.md"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "numpy>=2.3.2",
    "pdoc>=16.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-benchmark>=5.2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an asyncio coroutine",
]
python_files = ["test_*.py", "benchmark_*.py"]
testpaths = ["test"]
